version: '3.8'

services:
  # Backend .NET 10 Web API + SQLite
  libertapp-api:
    build:
      context: ./LibertApp.Api
      dockerfile: Dockerfile
    container_name: libertapp_backend
    restart: unless-stopped
    networks:
      - default
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # Opcional: define a senha das contas semeadas no primeiro start (Administrador e
      # usuária de demonstração). Se omitido, uma senha aleatória é gerada e impressa
      # uma única vez nos logs do container (`docker logs libertapp_backend`).
      # - AdminSeed__Password=defina-uma-senha-forte-aqui
      # - DemoUserSeed__Password=defina-uma-senha-forte-aqui
    volumes:
      # Persiste o banco SQLite central mesmo ao reiniciar ou recriar containers
      - libertapp_data:/app/data

  # Frontend Web (React / Vite + Nginx com proxy reverso para API)
  libertapp-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: libertapp_frontend
    restart: unless-stopped
    networks:
      - default
      - proxy
    depends_on:
      - libertapp-api
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.libertapp.rule=Host(`libertapp.tccodes.com.br`)"
      - "traefik.http.routers.libertapp.entrypoints=websecure"
      - "traefik.http.routers.libertapp.tls.certresolver=myresolver"
      - "traefik.http.services.libertapp.loadbalancer.server.port=80"

volumes:
  libertapp_data:
    driver: local

networks:
  default:
    driver: bridge
  proxy:
    external: true


